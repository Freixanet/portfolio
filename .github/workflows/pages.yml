# Every push is checked; only a version that passes reaches GitHub Pages.
name: Check and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The committed site matches its source
        run: |
          python3 src/build.py
          git diff --exit-code -- index.html styles.css app.js 404.html robots.txt sitemap.xml favicon.svg
      - name: Site checks
        run: python3 tests/check.py
      - name: Bundle what gets published
        run: |
          mkdir _site
          cp -R index.html 404.html styles.css app.js robots.txt sitemap.xml favicon.svg apple-touch-icon.png og.png .nojekyll img fonts vendor _site/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
